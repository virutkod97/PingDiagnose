{% extends "base.html" %}
{% block title %}Cấu hình{% endblock %}
{% block content %}
<h1>Cấu hình giám sát</h1>
<div class="card" style="max-width:620px">
  <form id="setForm">
    <div class="field" style="margin-bottom:12px"><label>Chu kỳ ping (giây)</label><input type="number" id="interval_seconds" min="30" max="86400" required></div>
    <div class="field" style="margin-bottom:12px"><label>Số gói ping mỗi chu kỳ</label><input type="number" id="ping_count" min="1" max="10" required></div>
    <div class="field" style="margin-bottom:12px"><label>Thời gian chờ mỗi gói (ms)</label><input type="number" id="ping_timeout_ms" min="100" max="10000" required></div>
    <div class="field" style="margin-bottom:12px"><label>Số chu kỳ lỗi liên tiếp để báo mất kết nối</label><input type="number" id="fail_threshold" min="1" max="100" required></div>
    <div class="field" style="margin-bottom:12px"><label>Số ngày lưu dữ liệu</label><input type="number" id="retention_days" min="0" max="3650" required></div>
    {% if user.role == 'admin' %}<button class="btn-primary" type="submit">Lưu cấu hình</button>{% endif %}
  </form>
</div>
<div class="card" style="max-width:820px">
  <h2>Chứng chỉ HTTPS</h2>
  <div id="certInfo" class="muted" style="margin-bottom:10px"></div>
  <div class="form-row">
    <a class="btn" href="/install-ca.bat">Tải file cài chứng chỉ (.bat)</a>
    <a class="btn" href="/ca.crt">Tải ca.crt</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const KEYS = ['interval_seconds', 'ping_count', 'ping_timeout_ms', 'fail_threshold', 'retention_days'];
(async () => {
  const s = (await api('/api/settings')).settings;
  KEYS.forEach(k => { const el = document.getElementById(k); el.value = s[k]; el.disabled = !APP.isAdmin; });
})();
(async () => {
  try {
    const c = await api('/api/cert');
    certInfo.innerHTML = c.https
      ? `Cấp bởi: ${esc(c.issuer)}<br>Hết hạn: ${esc(c.expires)}<br>Tên hợp lệ: ${esc(c.names.join(', '))}`
      : 'HTTPS đang tắt';
  } catch (e) { }
})();

setForm.onsubmit = async e => {
  e.preventDefault();
  const body = {}; KEYS.forEach(k => body[k] = +document.getElementById(k).value);
  try { await api('/api/settings', { method: 'PUT', body }); toast('Đã lưu', ''); }
  catch (err) { toast('Lỗi', err.message, 'err'); }
};
</script>
{% endblock %}
