<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - {{ app_name }}</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}">
</head>
<body>
<div class="login-wrap">
  <form class="login-box" method="post">
    <img class="login-logo" src="{{ url_for('static', filename='favicon.svg') }}" alt="">
    <h1>{{ app_name }}</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field"><label>Tên đăng nhập</label><input name="username" autofocus required autocomplete="username"></div>
    <div class="field"><label>Mật khẩu</label><input name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn-primary" type="submit">Đăng nhập</button>
    <p style="font-size:12px;margin:14px 0 0;text-align:center"><a href="/install-ca.bat">Cài chứng chỉ</a></p>
  </form>
</div>
</body>
</html>
