name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Unit tests
        env:
          REQUIRE_PING: "1"
        run: python -m pytest -v tests

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --clean PingDiagnose.spec

      - name: Assemble package
        shell: pwsh
        run: |
          Copy-Item install.bat, uninstall.bat, README.md dist/PingDiagnose/
          Compress-Archive -Force -Path dist/PingDiagnose -DestinationPath dist/PingDiagnose-win64.zip

      - name: Smoke test - Windows Service + HTTPS
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/PingDiagnose/PingDiagnose.exe).Path
          & $exe config --port 8765 --https on
          $ca = & $exe cert
          certutil -f -addstore Root $ca
          sc.exe create PingDiagnoseCI binPath= "`"$exe`"" start= demand
          sc.exe start PingDiagnoseCI
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing https://localhost:8765/login
              $ca2 = Invoke-WebRequest -UseBasicParsing https://localhost:8765/ca.crt
              if ($r.StatusCode -eq 200 -and $ca2.StatusCode -eq 200) { $ok = $true; break }
            } catch { $err = $_ }
          }
          if (-not $ok) { Write-Host "Loi: $err" }
          sc.exe query PingDiagnoseCI
          $log = "$env:ProgramData\PingDiagnose\logs\pingdiagnose.log"
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          sc.exe stop PingDiagnoseCI
          Start-Sleep -Seconds 5
          sc.exe query PingDiagnoseCI
          sc.exe delete PingDiagnoseCI
          if (-not $ok) { throw "Service khong phan hoi HTTPS" }

      - uses: actions/upload-artifact@v4
        with:
          name: PingDiagnose-win64
          path: dist/PingDiagnose-win64.zip

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pingdiagnose/config.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PingDiagnose v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/PingDiagnose-win64.zip
          body: |
            Tải `PingDiagnose-win64.zip`, giải nén, chuột phải `install.bat` → Run as administrator.
            Truy cập `https://IP-máy-chủ:8443`, đăng nhập admin / admin.
